backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Titulo", name: "title", widget: "string"}
      - {label: "Resumo", name: "summary", widget: "text"}
      - {label: "Categoria", name: "category", widget: "select", options: ["Saude Mental", "Setembro Amarelo", "Comunicacao", "Autocuidado", "Ansiedade", "Relacionamentos"]}
      - {label: "Data", name: "date", widget: "datetime"}
      - {label: "Autor", name: "author", widget: "string", default: "Remerson Santos"}
      - {label: "Imagem", name: "thumbnail", widget: "image", required: false}
      - {label: "Conteudo", name: "body", widget: "markdown"}
