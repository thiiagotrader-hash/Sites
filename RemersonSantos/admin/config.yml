backend:
  name: github
  repo: thiiagotrader-hash/Sites
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
media_folder: "RemersonSantos/images/uploads"
public_folder: "/RemersonSantos/images/uploads"
publish_mode: simple
display_url: "https://remerson.netlify.app"
collections:
  - name: "site"
    label: "Editar Site"
    files:
      - label: "Config"
        name: "settings"
        file: "RemersonSantos/content/settings/site.json"
        fields:
          - {label: "WhatsApp", name: "whatsapp", widget: "string", default: "5513997777213"}
  - name: "blog"
    label: "Blog"
    folder: "RemersonSantos/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Conteúdo", name: "body", widget: "markdown"}
