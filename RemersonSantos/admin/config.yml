backend:
  name: git-gateway
  branch: main

# Como o site está dentro de RemersonSantos/, ajustamos os caminhos
media_folder: "RemersonSantos/images/uploads"
public_folder: "/RemersonSantos/images/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "RemersonSantos/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Resumo", name: "summary", widget: "text"}
      - {label: "Categoria", name: "category", widget: "select", options: ["Saúde Mental", "Setembro Amarelo", "Comunicação", "Autocuidado", "Ansiedade", "Relacionamentos"]}
      - {label: "Data", name: "date", widget: "datetime"}
      - {label: "Autor", name: "author", widget: "string", default: "Rêmerson Santos"}
      - {label: "Imagem", name: "thumbnail", widget: "image", required: false}
      - {label: "Conteúdo", name: "body", widget: "markdown"}
