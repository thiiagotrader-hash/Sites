No processo terapêutico, trabalhamos três pontos: nomear o que está pesado sem julgamento, reconstruir permissão para pausar e criar micro-rituais de recuperação que cabem na rotina real.`,categoria:"Sobrecarga",imagem:en,publicado:!0},{id:"2",titulo:"Sinais sutis de que você passou do limite",resumo:"Irritação rápida, esquecimento e cansaço que não passa são alertas.",conteudo:`O corpo avisa antes da mente aceitar, na psicanálise isso é literal.

Freud já dizia: o que não encontra via de simbolização no psiquismo, encontra via no corpo. É o que chamamos de conversão e somatização.

Esses sinais que você listou são o inconsciente batendo na porta:

1. Irritação rápida e desproporcional
Não é sobre o outro. É um afeto que não foi ligado a uma representação. A raiva que você não pôde sentir no trabalho, na infância, com quem tinha poder sobre você, escapa pelo menor furo. Winnicott diria: é o verdadeiro self cansado de ser educado demais.

2. Acordar já cansado / cansaço que não passa
É a exaustão do Eu. O Eu gasta muita energia recalcando, segurando desejos, mantendo a fachada de "tá tudo bem". Esse trabalho é invisível, mas consome libido. Você acorda cansado porque trabalhou a noite inteira pra não sonhar o que dói.

3. Dificuldade de focar e esquecimento
Para a psicanálise, o esquecimento nunca é à toa. É ato falho. A mente se recusa a registrar o que é demais para processar. É um mecanismo de defesa: se eu não presto atenção, não preciso sentir.

4. Vontade de se isolar e sensação de estar sempre devendo
Aqui entra o superego cruel. Aquela voz interna que herdamos dos pais, da cultura, que diz "você nunca faz o suficiente". O isolamento é uma tentativa de se proteger desse julgamento interno, que projetamos nos outros.

Por que anotar por 7 dias sem resolver é tão potente analiticamente?

Porque é o oposto do que a gente faz normalmente, que é agir para não sentir. Anotar é o início da associação livre. Você não interpreta, não corrige. Só observa e dá nome. É o que Bion chama de transformar angústia em pensamento.

Você para de dizer "eu SOU irritado" e começa a dizer "eu ESTOU percebendo irritação em mim". Essa pequena distância já cria um sujeito que observa, e não só um sujeito que sofre.

É o mapa que usamos em sessão para perguntar: o que essa irritação está protegendo você de sentir?`,categoria:"Autocuidado",imagem:qn,publicado:!0},{id:"3",titulo:"Por que falar ajuda a organizar",resumo:"Dar nome ao que sente reduz a intensidade e devolve escolha.",conteudo:`Falar em terapia não é apenas desabafar. É um processo de co-regulação. Quando você nomeia uma emoção com alguém que escuta sem pressa de consertar, o cérebro cria distância entre o que te afeta e a sua reação.

É assim que saímos do modo automático para o modo de escolha. Pequenas escolhas diárias constroem autonomia emocional.

          <div style="display:flex;align-items:center;margin:18px 0 10px"><span class="icon-clear">🤝</span><h3 style="font-weight:700;font-size:15px">Quem é Rêmerson</h3></div>

          <div style="display:flex;align-items:center;margin:18px 0 10px"><span class="icon-clear">🛋️</span><h3 style="font-weight:700;font-size:15px">Abordagem Psicanalítica</h3></div>
          <div class="card-clear" style="background:#F0F4EF;border-color:#DDE7DC"><p style="font-size:11.5px;line-height:1.6">É uma abordagem criada por Freud que entende que muito do que sentimos e fazemos não vem da razão, mas do inconsciente. A ideia central é: nossos desejos, traumas, memórias de infância (principalmente as que doem) continuam vivos dentro de nós, mesmo sem percebermos, e influenciam como amamos, como sofremos, como nos sabotamos. O trabalho psicanalítico não é te dar conselhos ou técnicas. É te ajudar, pela fala, a escutar o que está por trás do que você diz e faz, para você parar de repetir sem perceber e poder escolher com mais liberdade. É menos sobre “consertar o sintoma” e mais sobre entender o que o sintoma está tentando dizer.</p></div>

  function initCarousel(){
    var track = document.getElementById('rs-track');
    if(!track || track.dataset.init) return;
    track.dataset.init = '1';
    var n = slides.length, idx = 0, timer = null;
    var dots = Array.prototype.slice.call(document.querySelectorAll('#rs-dots button'));
    function paint(){
      for(var i=0;i<dots.length;i++){
        dots[i].style.background = i===idx ? '#7A8F7A' : '#D8D2C8';
        dots[i].style.width = i===idx ? '26px' : '8px';
      }
    }
    function go(k){
      idx = (k+n)%n;
      track.style.transform = 'translateX(-'+(idx*100)+'%)';
      paint(); restart();
    }
    function restart(){
      if(timer) clearInterval(timer);
      timer = setInterval(function(){ go(idx+1); }, 6000);
    }
    document.getElementById('rs-prev').addEventListener('click', function(){ go(idx-1); });
    document.getElementById('rs-next').addEventListener('click', function(){ go(idx+1); });
    dots.forEach(function(d){ d.addEventListener('click', function(){ go(parseInt(d.dataset.i,10)); }); });
    var box = document.getElementById('rs-carousel');
    box.addEventListener('mouseenter', function(){ if(timer) clearInterval(timer); });
    box.addEventListener('mouseleave', restart);
    var sx = 0;
    box.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; if(timer) clearInterval(timer); }, {passive:true});
    box.addEventListener('touchend', function(e){
      var dx = e.changedTouches[0].clientX - sx;
      if(Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1)); else restart();
    }, {passive:true});
    paint(); restart();
  }

  function apply(){
    /* carrossel antes da seção verde */
    var green = null;
    Array.prototype.forEach.call(document.querySelectorAll('section'), function(s){
      if(!green && (s.textContent||'').indexOf('organizar tudo sozinho') > -1) green = s;
    });
    if(green){
      if(!document.getElementById('galeria-carrossel')){
        green.parentNode.insertBefore(buildCarousel(), green);
      }
      var vSec = null;
      var rmmSec = buildRMM();
      if(rmmSec){ green.parentNode.insertBefore(rmmSec, green); initRMM(); }
      var momSec = buildMomentos();
      if(momSec){ green.parentNode.insertBefore(momSec, green); initMomentos(); }

      var eSec = buildEvent();
      if(eSec){ green.parentNode.insertBefore(eSec, green); }
      var refSec = buildReflexoes();
      if(refSec){ green.parentNode.insertBefore(refSec, eSec || green); }
      green.style.position = 'relative';
      green.style.overflow = 'hidden';
      green.innerHTML = greenHTML();
      var st = document.createElement('style');
      st.textContent = '@media(min-width:768px){#rs-green-h2{font-size:46px !important}}';
      document.head.appendChild(st);
    }
    initCarousel();
    /* rodapé assinatura */
    var foot = document.querySelector('footer');

      foot.dataset.sig = '1';
      var oldAdmin = document.getElementById('admin-link');
      var heroImg = document.querySelector('img[data-editable="foto-hero"]');
      foot.style.background = '#fff';

        sig.style.flexDirection = 'row';
        sig.style.textAlign = 'left';
        sig.style.alignItems = 'flex-start';
